# Alembic configuration (keep this file ASCII-only: Alembic reads it with the
# OS locale encoding, so non-ASCII text breaks on e.g. cp949 / cp932 Windows).
#
# The DB URL is NOT written here. migrations/env.py reads it from
# app.core.config.settings (backend/.env), so no password lands in the repo.
#
#   python -m scripts.setup_db              # first install: DB + schema + seed
#   python -m alembic upgrade head          # schema only
#   python -m alembic revision -m "..."     # new migration file

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
